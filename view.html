<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown for Agents — Viewer</title>
  <style>
    :root {
      --orange: #F6821F;
      --bg: #ffffff;
      --surface: #f7f7f7;
      --border: #e8e8e8;
      --text: #111111;
      --text-dim: #555555;
      --mono: "IBM Plex Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
    }

    .header-url {
      flex: 1;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-dim);
      transition: border-color 0.15s, color 0.15s;
    }

    .copy-btn:hover { border-color: var(--orange); color: var(--orange); }
    .copy-btn.copied { border-color: var(--orange); color: var(--orange); }

    .mode-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--text-dim);
      transition: border-color 0.15s, color 0.15s;
    }

    .mode-btn:hover { border-color: var(--orange); color: var(--orange); }

    #content {
      padding: 20px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #rendered-content {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px;
      font-size: 15px;
      line-height: 1.65;
      word-break: break-word;
    }

    #rendered-content h1, #rendered-content h2, #rendered-content h3,
    #rendered-content h4, #rendered-content h5, #rendered-content h6 {
      margin: 1.2em 0 0.5em;
      line-height: 1.3;
    }

    #rendered-content h1 { font-size: 1.8em; }
    #rendered-content h2 { font-size: 1.5em; }
    #rendered-content h3 { font-size: 1.25em; }

    #rendered-content p, #rendered-content ul, #rendered-content ol, #rendered-content blockquote {
      margin: 0.8em 0;
    }

    #rendered-content ul, #rendered-content ol { padding-left: 1.5em; }

    #rendered-content a { color: var(--orange); text-decoration: none; }
    #rendered-content a:hover { text-decoration: underline; }

    #rendered-content code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: var(--surface);
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }

    #rendered-content pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      overflow-x: auto;
    }

    #rendered-content pre code {
      background: none;
      padding: 0;
    }

    #rendered-content blockquote {
      border-left: 3px solid var(--border);
      padding-left: 14px;
      color: var(--text-dim);
    }

    #rendered-content img { max-width: 100%; }

    #status {
      padding: 20px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-dim);
    }

    #status.error { color: #cc4444; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-url" id="header-url"></span>
    <button class="mode-btn" id="mode-btn" style="display:none">View as MD</button>
    <button class="copy-btn" id="copy-btn" style="display:none">Copy</button>
  </div>
  <div id="status">Loading…</div>
  <pre id="content" style="display:none"></pre>
  <div id="rendered-content" style="display:none"></div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="view.js"></script>
</body>
</html>
